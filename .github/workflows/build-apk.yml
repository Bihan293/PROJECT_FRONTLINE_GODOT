name: Build Godot 4 Android APK and Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses and verify tools
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Download Godot 4.3 and Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Configure Godot Editor Settings
        run: |
          chmod +x scripts/setup_godot_ci.sh
          bash scripts/setup_godot_ci.sh

      - name: Pre-heat Godot Cache
        run: |
          godot --headless --editor --quit || true

      - name: Build Android APK with Godot
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" ./build/PROJECT_FRONTLINE_v1.0.apk
          ls -lh build/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PROJECT_FRONTLINE_v1.0-apk
          path: build/PROJECT_FRONTLINE_v1.0.apk
          retention-days: 14

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.1.0"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Project Frontline v1.1.0 — Smart Bot AI & Articulated Dummies"
          body: |
            ## 🎮 Project Frontline v1.1.0 — Обновление ИИ Ботов и Моделей Солдат

            ### 🚀 Главные улучшения и исправления:
            - 🦾 **Полные 3D-модели манекенов Dummy War:** Солдаты и рэгдоллы теперь имеют полноценные руки, предплечья, бёдра, голени и боевые берцы.
            - 🧠 **Умный ИИ ботов (Line-of-Sight):** Добавлена физическая проверка препятствий — боты больше не стреляют сквозь здания и стены!
            - 🧭 **Обход препятствий (Steering / Obstacle Avoidance):** Боты плавно обходят дома и укрытия, не застревая в углах.
            - 🚩 **Тактический захват точек A, B, C:** Боты активно штурмуют и обороняют контрольные точки вместо бесцельного блуждания.
            - 💥 **Вспышки выстрелов (Muzzle Flash) и трассеры:** Теперь четко видно, откуда ведут огонь боты и союзники.
            - 🔄 **Авто-респавн бойцов:** Павшие солдаты возрождаются на базах через 4 секунды — поле боя никогда не пустеет.
            - 📱 **Исправлена мобильная стрельба:** Дробовик, снайперская винтовка и пистолет мгновенно стреляют при касании кнопки «ОГОНЬ».
            - 🎯 **Хитмаркер и экран ранения:** Индикация попаданий по врагам и красная виньетка урона по игроку.
            - 🩸 **Рэгдолл:** Безопасный срыв шлема при выстрелах в голову и физика падения с инерцией.

            ### 📲 Установка:
            Скачайте **`PROJECT_FRONTLINE_v1.0.apk`** ниже и установите на телефон.
          files: |
            build/PROJECT_FRONTLINE_v1.0.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
